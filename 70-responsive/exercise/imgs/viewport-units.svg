<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="400" fill="none"/>
  <!-- viewport -->
  <rect x="70" y="30" width="500" height="300" rx="6" fill="#1c3a4a" stroke="#ffffff" stroke-width="3"/>
  <text x="320" y="62" text-anchor="middle" font-size="18" fill="#ffffff">viewport</text>
  <!-- 25vw sidebar -->
  <rect x="70" y="80" width="125" height="250" fill="#2e7d9a" opacity="0.85"/>
  <text x="132" y="210" text-anchor="middle" font-size="16" fill="#ffffff">25vw</text>
  <!-- 50vmin square (smaller side = height 300 -> 150) -->
  <rect x="320" y="150" width="150" height="150" fill="#d98e04" opacity="0.9"/>
  <text x="395" y="232" text-anchor="middle" font-size="16" fill="#ffffff">50vmin</text>
  <!-- width arrow -->
  <line x1="70" y1="358" x2="570" y2="358" stroke="#ffffff" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="320" y="385" text-anchor="middle" font-size="18" fill="#ffffff">100vw</text>
  <!-- height arrow -->
  <line x1="40" y1="30" x2="40" y2="330" stroke="#ffffff" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="20" y="185" text-anchor="middle" font-size="18" fill="#ffffff" transform="rotate(-90 20 185)">100vh</text>
</svg>
