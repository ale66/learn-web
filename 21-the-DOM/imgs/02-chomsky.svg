<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Chomsky hierarchy with HTML placed in it</title>
  <g id="rings" stroke="#073642" stroke-width="2">
    <rect x="20"  y="20"  width="920" height="360" rx="18" fill="#e6ddc6"/>
    <rect x="70"  y="70"  width="820" height="290" rx="18" fill="#cfe3ea"/>
    <rect x="120" y="120" width="720" height="220" rx="18" fill="#bfe0c8"/>
    <rect x="170" y="170" width="620" height="140" rx="18" fill="#f5d5a8"/>
  </g>
  <g id="labels" fill="#073642" font-size="20" font-weight="bold">
    <text x="40"  y="50">Type 0 — recursively enumerable (Turing machines)</text>
    <text x="90"  y="100">Type 1 — context-sensitive</text>
    <text x="140" y="150">Type 2 — context-free (pushdown automata)</text>
    <text x="190" y="200">Type 3 — regular (finite automata)</text>
  </g>
  <g id="html-examples" fill="#073642" font-size="16">
    <text x="190" y="245">Tokenizer: tag names, attribute lists, text runs</text>
    <text x="190" y="275" font-family="monospace" fill="#586e75">&lt;a href="x"&gt;   &lt;/p&gt;   &amp;amp;</text>
    <text x="140" y="330">Idealised well-formed HTML: tags nest like matching brackets</text>
    <text x="90"  y="355">Real HTML5 tree construction: stack + extra state + error recovery</text>
    <text x="40"  y="374">JavaScript inside &lt;script&gt;: Turing-complete</text>
  </g>
</svg>
